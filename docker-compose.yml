services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cobble_sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks: [app_net]
    healthcheck:
      # localhost here = this container's own SQL process (a self-check).
      # All container-to-container traffic uses service names, per §3.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cobble_sql_init
    depends_on:
      sql:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./sql/init:/init:ro
    networks: [app_net]
    restart: "no"
    entrypoint: /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P \"$$SA_PASSWORD\" -C -b -i /init/init.sql"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cobble_api
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      SQL_SERVER: sql
      SQL_DATABASE: DiscussionPoC
      SQL_USER: sa
      SQL_PASSWORD: ${SA_PASSWORD}
    ports:
      - "8081:8080"
    networks: [app_net]
    healthcheck:
      # localhost = this container's own uvicorn process (self-check), per the §3 note
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: cobble_ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The browser (on the host) calls the API directly, so this must be
      # the host-published API port, not the "api" service name.
      API_BASE_URL: http://localhost:8081
      PORT: "8080"
    ports:
      - "8080:8080"
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sql_data:

networks:
  app_net:
    driver: bridge
