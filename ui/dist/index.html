<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobble 398 — Week 0</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    padding: var(--cobble-spacing-lg);
    background: var(--cobble-color-bg);
    color: var(--cobble-color-text);
    font-family: var(--cobble-font-base);
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--cobble-spacing-lg);
    background: #ffffff;
    border: 1px solid var(--cobble-color-secondary);
    border-radius: 6px;
  }
  p.sub { margin: 0 0 var(--cobble-spacing-lg); color: var(--cobble-color-secondary); }
  .pill {
    display: inline-block;
    padding: var(--cobble-spacing-sm) var(--cobble-spacing-md);
    border-radius: 6px;
    font-size: 13px;
  }
  .pill--pending { background: var(--cobble-color-secondary); color: #ffffff; }
  .pill--ok      { background: #2ea44f; color: #ffffff; }
  .pill--fail    { background: #d1242f; color: #ffffff; }
  pre {
    margin-top: var(--cobble-spacing-md);
    padding: var(--cobble-spacing-md);
    background: var(--cobble-color-bg);
    border: 1px solid var(--cobble-color-secondary);
    border-radius: 6px;
    font-size: 12px;
    overflow-x: auto;
  }
  button {
    margin-top: var(--cobble-spacing-md);
    padding: var(--cobble-spacing-sm) var(--cobble-spacing-md);
    background: var(--cobble-color-primary);
    color: #ffffff;
    border: 0;
    border-radius: 6px;
    font-family: var(--cobble-font-base);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 class="cobble-header">Cobble 398 — Week 0 Environment</h1>
    <p class="sub">Thin UI &rarr; API health endpoint. No direct database access.</p>
    <span id="status" class="pill pill--pending">checking&hellip;</span>
    <pre id="detail"></pre>
    <button id="refresh">Re-check</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
