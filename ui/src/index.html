<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Discussion Thread — PoC</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React via CDN, no build step — this stays a thin UI that only ever
       calls the API. It never imports or talks to SQL directly. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    // Hard-coded single thread for the PoC (per the plan's "Thread scope"
    // decision — don't build thread listing).
    const THREAD_ID = "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa";
    const API_BASE_URL = window.API_BASE_URL || "http://localhost:8080";

    // DEV ONLY: identifies the acting member to the API. Replaced by the JWT
    // Authorization header once auth is wired — the API reads identity from
    // one place either way, so nothing else in this file changes.
    const authHeaders = (memberId) => ({ "X-Member-Id": memberId });

    function VoteButtons({ comment, onVote }) {
      // Pressing an active button clears the vote (sends 0) — a toggle.
      const cast = (v) => onVote(comment.commentId, comment.myVote === v ? 0 : v);
      const isOwn = comment.isOwn;
      const title = isOwn ? "You cannot vote on your own comment" : undefined;
      return (
        <span className="vote-group">
          <button
            className={"btn-vote" + (comment.myVote === 1 ? " active-like" : "")}
            onClick={() => cast(1)}
            disabled={isOwn}
            title={title}
            aria-label="Like"
          >
            👍 {comment.likes}
          </button>
          <button
            className={"btn-vote" + (comment.myVote === -1 ? " active-dislike" : "")}
            onClick={() => cast(-1)}
            disabled={isOwn}
            title={title}
            aria-label="Dislike"
          >
            👎 {comment.dislikes}
          </button>
          <span className={"score" + (comment.score > 0 ? " pos" : comment.score < 0 ? " neg" : "")}>
            {comment.score > 0 ? `+${comment.score}` : comment.score}
          </span>
        </span>
      );
    }

    function CommentRow({ comment, replies, onDelete, onVote, replyingTo, setReplyingTo, replyDraft, setReplyDraft, onReply }) {
      const isReplying = replyingTo === comment.commentId;
      return (
        <div className="comment-row">
          <div className="comment-meta">
            <span className="comment-author">{comment.authorName}</span>
            <span className="karma-badge" title="Author karma: likes minus dislikes received">
              {comment.authorKarma >= 0 ? `★ ${comment.authorKarma}` : `★ ${comment.authorKarma}`}
            </span>
            <span className="comment-time">{new Date(comment.createdUtc).toLocaleString()}</span>
          </div>
          <div className="comment-body">{comment.body}</div>
          <div className="comment-actions">
            <VoteButtons comment={comment} onVote={onVote} />
            <button className="btn-delete" onClick={() => onDelete(comment.commentId)}>Delete</button>
            <button className="btn-reply" onClick={() => setReplyingTo(isReplying ? null : comment.commentId)}>
              {isReplying ? "Cancel" : "Reply"}
            </button>
          </div>

          {isReplying && (
            <form className="reply-form" onSubmit={(e) => { e.preventDefault(); onReply(comment.commentId); }}>
              <input
                type="text"
                placeholder="Write a reply…"
                value={replyDraft}
                onChange={(e) => setReplyDraft(e.target.value)}
              />
              <button type="submit" className="btn-add">Reply</button>
            </form>
          )}

          {replies.length > 0 && (
            <div className="reply-list">
              {replies.map((r) => (
                <div key={r.commentId} className="comment-row reply-row">
                  <div className="comment-meta">
                    <span className="comment-author">{r.authorName}</span>
                    <span className="karma-badge">★ {r.authorKarma}</span>
                    <span className="comment-time">{new Date(r.createdUtc).toLocaleString()}</span>
                  </div>
                  <div className="comment-body">{r.body}</div>
                  <div className="comment-actions">
                    <VoteButtons comment={r} onVote={onVote} />
                    <button className="btn-delete" onClick={() => onDelete(r.commentId)}>Delete</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function KarmaPanel({ board, me }) {
      if (!board.length) return null;
      return (
        <div className="karma-panel">
          <h2>Top Karma</h2>
          <table className="karma-table">
            <thead>
              <tr><th>Member</th><th>Posts</th><th>👍</th><th>👎</th><th>Karma</th></tr>
            </thead>
            <tbody>
              {board.map((m) => (
                <tr key={m.memberId} className={m.memberId === me ? "is-me" : ""}>
                  <td>{m.memberName}</td>
                  <td>{m.commentCount}</td>
                  <td>{m.likesReceived}</td>
                  <td>{m.dislikesReceived}</td>
                  <td className={m.karma > 0 ? "pos" : m.karma < 0 ? "neg" : ""}>
                    {m.karma > 0 ? `+${m.karma}` : m.karma}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function App() {
      const [comments, setComments] = useState([]);
      const [karma, setKarma] = useState([]);
      const [members, setMembers] = useState([]);
      const [me, setMe] = useState("30000000-0000-0000-0000-000000000001");
      const [draft, setDraft] = useState("");
      const [status, setStatus] = useState("loading");
      const [error, setError] = useState(null);
      const [replyingTo, setReplyingTo] = useState(null);
      const [replyDraft, setReplyDraft] = useState("");

      useEffect(() => {
        fetch(`${API_BASE_URL}/members`)
          .then((res) => res.json())
          .then(setMembers)
          .catch(() => setMembers([]));
      }, []);

      const load = useCallback(() => {
        setStatus("loading");
        Promise.all([
          fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments`, { headers: authHeaders(me) })
            .then((res) => {
              if (!res.ok) throw new Error(`GET failed: ${res.status}`);
              return res.json();
            }),
          fetch(`${API_BASE_URL}/karma`).then((res) => (res.ok ? res.json() : [])),
        ])
          .then(([data, board]) => {
            // The API never lets a member vote on their own comment; marking
            // it here keeps the buttons disabled rather than failing on click.
            setComments(data.map((c) => ({ ...c, isOwn: c.authorMemberId === me })));
            setKarma(board);
            setStatus("ready");
            setError(null);
          })
          .catch((err) => {
            setStatus("error");
            setError(err.message);
          });
      }, [me]);

      useEffect(() => { load(); }, [load]);

      const postComment = (body, parentCommentId) => {
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders(me) },
          body: JSON.stringify({ body, parentCommentId: parentCommentId ?? null }),
        })
          .then((res) => {
            if (!res.ok) throw new Error(`POST failed: ${res.status}`);
            return res.json();
          })
          .then(() => { setReplyingTo(null); setReplyDraft(""); load(); })
          .catch((err) => setError(err.message));
      };

      const submitComment = (e) => {
        e.preventDefault();
        if (!draft.trim()) return;
        postComment(draft);
        setDraft("");
      };

      const vote = (commentId, value) => {
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments/${commentId}/vote`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", ...authHeaders(me) },
          body: JSON.stringify({ value }),
        })
          .then(async (res) => {
            if (!res.ok) {
              const b = await res.json().catch(() => ({}));
              throw new Error(b.message || `Vote failed: ${res.status}`);
            }
            return res.json();
          })
          // Reload rather than patching state locally: a vote changes the
          // author's karma everywhere it appears, not just this one row.
          .then(() => { setError(null); load(); })
          .catch((err) => setError(err.message));
      };

      const deleteComment = (commentId) => {
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments/${commentId}`, {
          method: "DELETE",
          headers: authHeaders(me),
        })
          .then((res) => {
            if (!res.ok && res.status !== 204) throw new Error(`DELETE failed: ${res.status}`);
            load();
          })
          .catch((err) => setError(err.message));
      };

      const topLevel = comments.filter((c) => !c.parentCommentId);
      const repliesByParent = {};
      for (const c of comments) {
        if (c.parentCommentId) (repliesByParent[c.parentCommentId] ??= []).push(c);
      }

      return (
        <div className="card">
          <div className="header-row">
            <h1>Discussion Thread — PoC</h1>
            {members.length > 0 && (
              <label className="member-picker">
                Viewing as
                <select value={me} onChange={(e) => setMe(e.target.value)}>
                  {members.map((m) => (
                    <option key={m.memberId} value={m.memberId}>{m.memberName}</option>
                  ))}
                </select>
              </label>
            )}
          </div>
          <p className="thread-id">Thread: {THREAD_ID}</p>

          {status === "loading" && <p>Loading…</p>}
          {error && <p className="status-fail">Error: {error}</p>}

          <KarmaPanel board={karma} me={me} />

          <div className="comment-list">
            {topLevel.map((c) => (
              <CommentRow
                key={c.commentId}
                comment={c}
                replies={repliesByParent[c.commentId] || []}
                onDelete={deleteComment}
                onVote={vote}
                replyingTo={replyingTo}
                setReplyingTo={setReplyingTo}
                replyDraft={replyDraft}
                setReplyDraft={setReplyDraft}
                onReply={(parentId) => postComment(replyDraft, parentId)}
              />
            ))}
            {status === "ready" && comments.length === 0 && (
              <p className="empty">No comments yet.</p>
            )}
          </div>

          <form className="add-form" onSubmit={submitComment}>
            <input
              type="text"
              placeholder="Add a comment…"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
            />
            <button type="submit" className="btn-add">Add</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
