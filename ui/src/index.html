<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Discussion Thread — PoC</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React via CDN, no build step — this stays a thin UI that only ever
       calls the API. It never imports or talks to SQL directly. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    // Hard-coded single thread for the PoC (per the plan's "Thread scope"
    // decision — don't build thread listing).
    const THREAD_ID = "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa";
    const API_BASE_URL = window.API_BASE_URL || "http://localhost:8080";

    function CommentRow({ comment, onDelete }) {
      return (
        <div className="comment-row">
          <div className="comment-meta">
            <span className="comment-author">{comment.authorName}</span>
            <span className="comment-time">
              {new Date(comment.createdUtc).toLocaleString()}
            </span>
          </div>
          <div className="comment-body">{comment.body}</div>
          <button className="btn-delete" onClick={() => onDelete(comment.commentId)}>
            Delete
          </button>
        </div>
      );
    }

    function App() {
      const [comments, setComments] = useState([]);
      const [draft, setDraft] = useState("");
      const [status, setStatus] = useState("loading");
      const [error, setError] = useState(null);

      const load = useCallback(() => {
        setStatus("loading");
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments`)
          .then((res) => {
            if (!res.ok) throw new Error(`GET failed: ${res.status}`);
            return res.json();
          })
          .then((data) => {
            setComments(data);
            setStatus("ready");
            setError(null);
          })
          .catch((err) => {
            setStatus("error");
            setError(err.message);
          });
      }, []);

      useEffect(() => {
        load();
      }, [load]);

      const addComment = (e) => {
        e.preventDefault();
        if (!draft.trim()) return;
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: draft }),
        })
          .then((res) => {
            if (!res.ok) throw new Error(`POST failed: ${res.status}`);
            return res.json();
          })
          .then(() => {
            setDraft("");
            load();
          })
          .catch((err) => setError(err.message));
      };

      const deleteComment = (commentId) => {
        fetch(`${API_BASE_URL}/threads/${THREAD_ID}/comments/${commentId}`, {
          method: "DELETE",
        })
          .then((res) => {
            if (!res.ok && res.status !== 204) {
              throw new Error(`DELETE failed: ${res.status}`);
            }
            load();
          })
          .catch((err) => setError(err.message));
      };

      return (
        <div className="card">
          <h1>Discussion Thread — PoC</h1>
          <p className="thread-id">Thread: {THREAD_ID}</p>

          {status === "loading" && <p>Loading…</p>}
          {status === "error" && <p className="status-fail">Error: {error}</p>}

          <div className="comment-list">
            {comments.map((c) => (
              <CommentRow key={c.commentId} comment={c} onDelete={deleteComment} />
            ))}
            {status === "ready" && comments.length === 0 && (
              <p className="empty">No comments yet.</p>
            )}
          </div>

          <form className="add-form" onSubmit={addComment}>
            <input
              type="text"
              placeholder="Add a comment…"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
            />
            <button type="submit" className="btn-add">Add</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
